upstream osrm_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- Xóa header CORS từ OSRM trước khi thêm mới ---
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # --- CORS cho tất cả request ---
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Authorization, Accept' always;

    # --- Xử lý preflight ---
    if ($request_method = OPTIONS) {
        return 204;
    }

    # --- Health check ---
    location = /health {
        add_header Content-Type text/plain;
        return 200 'OSRM backend is running';
    }

    # --- Proxy toàn bộ sang OSRM ---
    location / {
        proxy_pass http://osrm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
